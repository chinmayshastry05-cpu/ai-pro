name: evidence
on:
  push:
    branches: [ 'beta/evidence' ]
    paths: [ '.github/workflows/17-evidence.yml' ]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        which: [ baseline-0.8.9, secure-arm64 ]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { ref: test/muse-v7 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/download-artifact@v4
        with:
          name: secure-apks
          path: dl
          run-id: 40006706321
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: place the APK under test
        run: |
          set -e
          mkdir -p app/build/outputs/apk/debug apk
          if [ "${{ matrix.which }}" = "baseline-0.8.9" ]; then
            curl -sL -o apk/test.apk https://github.com/${{ github.repository }}/releases/download/v0.8.9/AI-Pro-v0.8.9.apk
            echo "e2c975c181e914d1c0fa15145809467ff5163e11d8f54a1d13288edb74360d6b  apk/test.apk" | sha256sum -c -
          else
            cp dl/AI-Pro-v0.8.9-secure-beta1.apk apk/test.apk
          fi
          cp apk/test.apk app/build/outputs/apk/debug/app-debug.apk
          sha256sum apk/test.apk
      - run: python3 -m pip install --user pillow
      - run: (cd ci && nohup python3 -m http.server 8901 >/tmp/httpd.log 2>&1 &)
      - name: write the assist script
        run: |
          cat > ci-assist2.sh <<'SH'
          #!/bin/bash
          mkdir -p out; P=com.aipro.select
          adb wait-for-device; sleep 10
          adb logcat -c
          adb shell settings put secure voice_interaction_service $P/$P.AssistService
          adb shell settings put secure assistant $P/$P.AssistService
          adb shell settings put secure voice_recognition_service $P/$P.AssistRecognitionService
          sleep 8
          echo "--- settings"; adb shell settings get secure voice_interaction_service; adb shell settings get secure assistant; adb shell settings get secure voice_recognition_service
          echo "--- role holders"; adb shell cmd role get-role-holders --user 0 android.app.role.ASSISTANT
          echo "--- dumpsys voiceinteraction (head)"; adb shell dumpsys voiceinteraction | head -60
          echo "--- query services"
          adb shell cmd package query-services -a android.service.voice.VoiceInteractionService | grep -E "packageName|name=" | head
          adb shell am start -a android.intent.action.ASSIST; sleep 8
          adb shell screencap -p /sdcard/assist.png; adb pull /sdcard/assist.png out/assist.png
          adb shell am start -n $P/.MainActivity; sleep 6
          adb shell screencap -p /sdcard/main.png; adb pull /sdcard/main.png out/main.png
          echo "--- logcat lines mentioning fatal/security/aipro"
          adb logcat -d | grep -E "FATAL EXCEPTION|SecurityException|AndroidRuntime|aipro" | tail -40
          echo "--- app process"; adb shell pidof $P
          SH
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: smoke then assist checks on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash -c "bash ci/smoke.sh; bash ci-assist2.sh | tee out/assist-log.txt"
        env:
          RG_CASES: "C1 C2 C6 C10 C11 C12"
      - name: print verdicts and logs
        if: always()
        run: |
          echo "=== RG VERDICTS"; cat ci/out/rg-verdicts.txt || true
          echo "=== ASSIST LOG"; cat out/assist-log.txt || true
      - name: print screenshots as base64 jpeg
        if: always()
        run: |
          python3 - <<'PY'
          import glob,base64,io
          from PIL import Image
          files=sorted(glob.glob('ci/out/*.png'))+sorted(glob.glob('out/*.png'))
          for f in files:
              im=Image.open(f).convert('RGB'); w,h=im.size; im=im.resize((540,int(h*540/w)))
              b=io.BytesIO(); im.save(b,'JPEG',quality=55)
              print('@@IMG',f,len(b.getvalue()))
              print('@@B64',base64.b64encode(b.getvalue()).decode())
              print('@@END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "evidence-${{ matrix.which }}", path: "ci/out/\nout/" }
