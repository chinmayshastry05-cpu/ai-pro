name: emulator-test
on:
  push:
    branches: [ci-test]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: set up Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: build debug APK
        run: gradle assembleDebug --no-daemon -Dkotlin.compiler.execution.strategy=in-process
      - name: serve test page
        run: (cd ci && nohup python3 -m http.server 8901 >/tmp/httpd.log 2>&1 &)
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash ci/run-test.sh
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ci/out/
      - name: build release APK
        run: gradle assembleRelease --no-daemon -Dkotlin.compiler.execution.strategy=in-process
      - name: sign release APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > /tmp/ks.jks
          BT=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/ks.jks --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --ks-key-alias "$KEY_ALIAS" --out /tmp/AIPro-signed.apk /tmp/aligned.apk
          "$BT/apksigner" verify --print-certs /tmp/AIPro-signed.apk
          sha256sum /tmp/AIPro-signed.apk
      - name: upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: /tmp/AIPro-signed.apk
