name: emulator-test
on:
  push:
    branches: [ci-test]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: set up Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: build debug APK
        run: gradle assembleDebug --no-daemon -Dkotlin.compiler.execution.strategy=in-process
      - name: serve test page
        run: (cd ci && nohup python3 -m http.server 8901 >/tmp/httpd.log 2>&1 &)
      - name: run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ci/run-test.sh
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ci/out/
