name: emulator-regression
on:
  push:
    branches: [ 'test/**' ]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '7.6.4' }
      - uses: actions/download-artifact@v4
        with: { name: clean-candidate, path: dl, run-id: 39970931653, github-token: '${{ secrets.GITHUB_TOKEN }}' }
      - name: verify hash then place the exact candidate APK
        run: |
          cd dl && sha256sum -c <(grep "AI-Pro-v0.8.9-test2-unverified.apk" sha256.txt | sed 's#out/##') && cd ..
          mkdir -p app/build/outputs/apk/debug; cp dl/AI-Pro-v0.8.9-test2-unverified.apk app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: install pillow for screenshot diffs
        run: python3 -m pip install --user pillow
      - name: serve test page
        run: (cd ci && nohup python3 -m http.server 8901 >/tmp/httpd.log 2>&1 &)
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: run existing script then regression checks on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash ci/smoke.sh
        env:
          RG_CASES: "C1 C2 C6 C11 C12"
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: ci/out/
