name: secure-beta
on:
  push:
    branches: [ 'beta/secure' ]
    paths: [ '.github/workflows/16-secure.yml' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: require signing secrets
        run: test -n "$KS_B64" || { echo "no keystore secret"; exit 1; }
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0, path: src }
      - name: confirm main is the accepted 0.8.9 source
        run: test "$(git -C src rev-parse HEAD)" = "150285ca42d40d9dbe046aa76033def21e34d142"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '7.6.4' }
      - name: apply the bounded hardening changes
        run: |
          set -e
          cd src
          python3 - <<'PY'
          import re
          p='app/src/main/res/xml/aipro_accessibility_service.xml'
          s=open(p).read()
          assert 'accessibilityEventTypes="typeAllMask"' in s
          s=s.replace('accessibilityEventTypes="typeAllMask"','accessibilityEventTypes="typeWindowStateChanged"')
          open(p,'w').write(s)
          p='app/src/main/AndroidManifest.xml'
          s=open(p).read()
          line='    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
          assert line in s
          s=s.replace(line,'')
          open(p,'w').write(s)
          p='app/src/main/java/com/aipro/select/ImageProvider.kt'
          s=open(p).read()
          old='    override fun onCreate() = true\n'
          new=('    override fun onCreate(): Boolean {\n'
               '        // Crops and GIFs shared through this provider live in cache/img. Delete anything older than 24 h so old screen captures do not linger.\n'
               '        try {\n'
               '            File(context!!.cacheDir, "img").listFiles()?.forEach {\n'
               '                if (System.currentTimeMillis() - it.lastModified() > 24L * 3600L * 1000L) it.delete()\n'
               '            }\n'
               '        } catch (e: Exception) { }\n'
               '        return true\n'
               '    }\n')
          assert old in s
          s=s.replace(old,new)
          open(p,'w').write(s)
          PY
          sed -i 's/versionCode 33/versionCode 35/; s/versionName "0.8.9"/versionName "0.8.9-secure-beta1"/' app/build.gradle
          grep -q 'versionCode 35' app/build.gradle
          git diff --stat
          git diff
      - name: build arm64 release
        run: cd src && gradle assembleRelease --no-daemon -Dkotlin.compiler.execution.strategy=in-process && cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/arm64-unsigned.apk
      - name: commit arm64 variant to source branch
        run: |
          set -e
          cd src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b beta/secure-src
          git add -A app
          git commit -q -m "0.8.9 secure beta: release build, narrower accessibility events, drop unused RECORD_AUDIO, purge old cached captures"
          git push --force origin beta/secure-src
          git checkout -q -b beta/secure-v7a-src
          sed -i "s/abiFilters 'arm64-v8a'/abiFilters 'armeabi-v7a'/; s/versionCode 35/versionCode 36/; s/versionName \"0.8.9-secure-beta1\"/versionName \"0.8.9-secure-v7a-beta1\"/" app/build.gradle
          grep -q "abiFilters 'armeabi-v7a'" app/build.gradle
          grep -q 'versionCode 36' app/build.gradle
          git add app/build.gradle
          git commit -q -m "0.8.9 secure beta, 32-bit variant: ABI filter and version only"
          git push --force origin beta/secure-v7a-src
      - name: build v7a release
        run: cd src && gradle assembleRelease --no-daemon -Dkotlin.compiler.execution.strategy=in-process && cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/v7a-unsigned.apk
      - name: sign both
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p /tmp/out
          echo "$KS_B64" | base64 -d > /tmp/ks.jks
          BT=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          for v in arm64:AI-Pro-v0.8.9-secure-beta1.apk v7a:AI-Pro-v0.8.9-secure-v7a-beta1.apk; do
            k=${v%%:*}; n=${v#*:}
            "$BT/zipalign" -f 4 /tmp/$k-unsigned.apk /tmp/$k-aligned.apk
            "$BT/apksigner" sign --ks /tmp/ks.jks --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --ks-key-alias "$KEY_ALIAS" --out /tmp/out/$n /tmp/$k-aligned.apk
          done
          rm -f /tmp/ks.jks
      - name: static checks on both APKs
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          for pair in AI-Pro-v0.8.9-secure-beta1.apk:arm64-v8a:35 AI-Pro-v0.8.9-secure-v7a-beta1.apk:armeabi-v7a:36; do
            n=${pair%%:*}; r=${pair#*:}; abi=${r%%:*}; code=${r#*:}
            A=/tmp/out/$n
            echo "=== $n"
            "$BT/apksigner" verify --verbose --print-certs $A | tee /tmp/cert.txt
            grep -q "ab63ad55f11acc2f11bc8f56bf35a56a989c260f628720c7632cee2c0aeb1f06" /tmp/cert.txt
            "$BT/aapt2" dump badging $A > /tmp/badging.txt
            grep -E "^package|sdkVersion|native-code|uses-permission" /tmp/badging.txt
            grep -q "versionCode='$code'" /tmp/badging.txt
            grep -q "native-code: '$abi'" /tmp/badging.txt
            test "$(grep -c '^native-code' /tmp/badging.txt)" = "1"
            if grep -q "RECORD_AUDIO" /tmp/badging.txt; then echo "RECORD_AUDIO present"; exit 1; fi
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml $A > /tmp/manifest.txt
            if grep -qi "debuggable" /tmp/manifest.txt; then echo "debuggable flag present"; exit 1; fi
            unzip -l $A | grep 'lib/' > /tmp/libs.txt
            test "$(grep -c "lib/$abi/" /tmp/libs.txt)" = "8"
            test "$(grep -c 'lib/' /tmp/libs.txt)" = "8"
            rm -rf /tmp/x && mkdir /tmp/x && (cd /tmp/x && unzip -q $A 'lib/*')
            for f in /tmp/x/lib/$abi/*.so; do readelf -h $f | grep -E 'Class|Machine' | tr '\n' ' '; echo; done | tee /tmp/elf.txt
            found=0
            for x in $(unzip -Z1 $A | grep '^res/.*\.xml$'); do
              "$BT/aapt2" dump xmltree --file $x $A > /tmp/xt.txt 2>/dev/null || continue
              if grep -q canTakeScreenshot /tmp/xt.txt; then
                echo "a11y config file: $x"
                grep -E "ventTypes|canTakeScreenshot|canRetrieveWindowContent|lags" /tmp/xt.txt
                grep -q "ventTypes" /tmp/xt.txt || { echo "no eventTypes attribute"; exit 1; }
                if grep -E "ventTypes" /tmp/xt.txt | grep -q -E "0xffffffff|=-1|=4294967295|typeAllMask"; then echo "event types still all"; exit 1; fi
                found=1
              fi
            done
            test "$found" = "1"
            sha256sum $A
          done
      - uses: actions/upload-artifact@v4
        with: { name: secure-apks, path: /tmp/out/ }
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        which: [ baseline-0.8.9, secure-arm64 ]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { ref: test/muse-v7 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/download-artifact@v4
        with: { name: secure-apks, path: dl }
      - name: place the APK under test
        run: |
          set -e
          mkdir -p app/build/outputs/apk/debug
          if [ "${{ matrix.which }}" = "baseline-0.8.9" ]; then
            curl -sL -o app/build/outputs/apk/debug/app-debug.apk https://github.com/${{ github.repository }}/releases/download/v0.8.9/AI-Pro-v0.8.9.apk
            echo "e2c975c181e914d1c0fa15145809467ff5163e11d8f54a1d13288edb74360d6b  app/build/outputs/apk/debug/app-debug.apk" | sha256sum -c -
          else
            cp dl/AI-Pro-v0.8.9-secure-beta1.apk app/build/outputs/apk/debug/app-debug.apk
          fi
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - run: python3 -m pip install --user pillow
      - run: (cd ci && nohup python3 -m http.server 8901 >/tmp/httpd.log 2>&1 &)
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash ci/smoke.sh
        env:
          RG_CASES: "C1 C2 C6 C10 C11 C12"
      - name: show verdicts
        if: always()
        run: cat ci/out/rg-verdicts.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "smoke-${{ matrix.which }}", path: ci/out/ }
  assist:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        which: [ baseline-0.8.9, secure-arm64 ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with: { name: secure-apks, path: dl }
      - name: place the APK under test
        run: |
          set -e
          mkdir -p apk
          if [ "${{ matrix.which }}" = "baseline-0.8.9" ]; then
            curl -sL -o apk/test.apk https://github.com/${{ github.repository }}/releases/download/v0.8.9/AI-Pro-v0.8.9.apk
            echo "e2c975c181e914d1c0fa15145809467ff5163e11d8f54a1d13288edb74360d6b  apk/test.apk" | sha256sum -c -
          else
            cp dl/AI-Pro-v0.8.9-secure-beta1.apk apk/test.apk
          fi
          sha256sum apk/test.apk
      - name: write the test script
        run: |
          cat > ci-assist.sh <<'SH'
          #!/bin/bash
          mkdir -p out; P=com.aipro.select
          adb wait-for-device; sleep 20
          adb install -r apk/test.apk && echo INSTALL=OK | tee -a out/v.txt || { echo INSTALL=FAIL | tee -a out/v.txt; exit 0; }
          adb shell dumpsys package $P | grep -E "RECORD_AUDIO|DEBUGGABLE|versionCode" | tee out/pkg.txt
          grep -q DEBUGGABLE out/pkg.txt && echo "FLAGS_DEBUGGABLE=$(grep -o 'DEBUGGABLE' out/pkg.txt | head -1)" | tee -a out/v.txt || echo FLAGS_DEBUGGABLE=none | tee -a out/v.txt
          adb shell cmd package query-services -a android.service.voice.VoiceInteractionService | tee out/vis.txt
          grep -q $P out/vis.txt && echo VIS_REGISTERED=yes | tee -a out/v.txt || echo VIS_REGISTERED=no | tee -a out/v.txt
          adb shell cmd package query-services -a android.speech.RecognitionService | grep -q $P && echo RECOG_REGISTERED=yes | tee -a out/v.txt || echo RECOG_REGISTERED=no | tee -a out/v.txt
          adb logcat -c
          adb shell settings put secure voice_interaction_service $P/$P.AssistService
          adb shell settings put secure assistant $P/$P.AssistService
          adb shell settings put secure voice_recognition_service $P/$P.AssistRecognitionService
          sleep 8
          adb shell settings get secure voice_interaction_service | tee out/vis-setting.txt
          adb shell dumpsys voiceinteraction > out/dump-vi.txt 2>&1
          grep -E "AssistService|aipro" out/dump-vi.txt | head -10 | tee out/dump-vi-grep.txt
          grep -q "aipro" out/dump-vi.txt && echo VI_BOUND_IN_DUMPSYS=yes | tee -a out/v.txt || echo VI_BOUND_IN_DUMPSYS=no | tee -a out/v.txt
          adb shell am start -a android.intent.action.ASSIST; sleep 8
          adb shell screencap -p /sdcard/assist.png; adb pull /sdcard/assist.png out/assist.png
          adb logcat -d | grep -E "aipro|AndroidRuntime|FATAL|SecurityException" | tail -40 > out/log.txt
          echo FATAL_COUNT=$(grep -c -E "FATAL EXCEPTION|SecurityException" out/log.txt) | tee -a out/v.txt
          adb shell pidof $P >/dev/null && echo PROCESS_ALIVE=yes | tee -a out/v.txt || echo PROCESS_ALIVE=no | tee -a out/v.txt
          SH
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: assistant role and package checks on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash ci-assist.sh
      - name: show verdicts
        if: always()
        run: cat out/v.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "assist-${{ matrix.which }}", path: out/ }
