name: secure-beta
on:
  push:
    branches: [ 'beta/secure' ]
    paths: [ '.github/workflows/16-secure.yml' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: require signing secrets
        run: test -n "$KS_B64" || { echo "no keystore secret"; exit 1; }
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0, path: src }
      - name: confirm main is the accepted 0.8.9 source
        run: test "$(git -C src rev-parse HEAD)" = "150285ca42d40d9dbe046aa76033def21e34d142"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '7.6.4' }
      - name: apply the bounded hardening changes
        run: |
          set -e
          cd src
          python3 - <<'PY'
          import re
          p='app/src/main/res/xml/aipro_accessibility_service.xml'
          s=open(p).read()
          assert 'accessibilityEventTypes="typeAllMask"' in s
          s=s.replace('accessibilityEventTypes="typeAllMask"','accessibilityEventTypes="typeWindowStateChanged"')
          open(p,'w').write(s)
          p='app/src/main/AndroidManifest.xml'
          s=open(p).read()
          line='    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
          assert line in s
          s=s.replace(line,'')
          open(p,'w').write(s)
          p='app/src/main/java/com/aipro/select/ImageProvider.kt'
          s=open(p).read()
          old='    override fun onCreate() = true\n'
          new=('    override fun onCreate(): Boolean {\n'
               '        // Crops and GIFs shared through this provider live in cache/img. Delete anything older than 24 h so old screen captures do not linger.\n'
               '        try {\n'
               '            File(context!!.cacheDir, "img").listFiles()?.forEach {\n'
               '                if (System.currentTimeMillis() - it.lastModified() > 24L * 3600L * 1000L) it.delete()\n'
               '            }\n'
               '        } catch (e: Exception) { }\n'
               '        return true\n'
               '    }\n')
          assert old in s
          s=s.replace(old,new)
          open(p,'w').write(s)
          PY
          sed -i 's/versionCode 33/versionCode 35/; s/versionName "0.8.9"/versionName "0.8.9-secure-beta1"/' app/build.gradle
          grep -q 'versionCode 35' app/build.gradle
          git diff --stat
          git diff
      - name: build arm64 release
        run: cd src && gradle assembleRelease --no-daemon -Dkotlin.compiler.execution.strategy=in-process && cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/arm64-unsigned.apk
      - name: commit arm64 variant to source branch
        run: |
          set -e
          cd src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b beta/secure-src
          git add -A app
          git commit -q -m "0.8.9 secure beta: release build, narrower accessibility events, drop unused RECORD_AUDIO, purge old cached captures"
          git push origin beta/secure-src
          git checkout -q -b beta/secure-v7a-src
          sed -i "s/abiFilters 'arm64-v8a'/abiFilters 'armeabi-v7a'/; s/versionCode 35/versionCode 36/; s/versionName \"0.8.9-secure-beta1\"/versionName \"0.8.9-secure-v7a-beta1\"/" app/build.gradle
          grep -q "abiFilters 'armeabi-v7a'" app/build.gradle
          grep -q 'versionCode 36' app/build.gradle
          git add app/build.gradle
          git commit -q -m "0.8.9 secure beta, 32-bit variant: ABI filter and version only"
          git push origin beta/secure-v7a-src
      - name: build v7a release
        run: cd src && gradle assembleRelease --no-daemon -Dkotlin.compiler.execution.strategy=in-process && cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/v7a-unsigned.apk
      - name: sign both
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p /tmp/out
          echo "$KS_B64" | base64 -d > /tmp/ks.jks
          BT=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          for v in arm64:AI-Pro-v0.8.9-secure-beta1.apk v7a:AI-Pro-v0.8.9-secure-v7a-beta1.apk; do
            k=${v%%:*}; n=${v#*:}
            "$BT/zipalign" -f 4 /tmp/$k-unsigned.apk /tmp/$k-aligned.apk
            "$BT/apksigner" sign --ks /tmp/ks.jks --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --ks-key-alias "$KEY_ALIAS" --out /tmp/out/$n /tmp/$k-aligned.apk
          done
          rm -f /tmp/ks.jks
      - name: static checks on both APKs
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          for pair in AI-Pro-v0.8.9-secure-beta1.apk:arm64-v8a:35 AI-Pro-v0.8.9-secure-v7a-beta1.apk:armeabi-v7a:36; do
            n=${pair%%:*}; r=${pair#*:}; abi=${r%%:*}; code=${r#*:}
            A=/tmp/out/$n
            echo "=== $n"
            "$BT/apksigner" verify --verbose --print-certs $A | tee /tmp/cert.txt
            grep -q "ab63ad55f11acc2f11bc8f56bf35a56a989c260f628720c7632cee2c0aeb1f06" /tmp/cert.txt
            "$BT/aapt2" dump badging $A > /tmp/badging.txt
            grep -E "^package|sdkVersion|native-code|uses-permission" /tmp/badging.txt
            grep -q "versionCode='$code'" /tmp/badging.txt
            grep -q "native-code: '$abi'" /tmp/badging.txt
            test "$(grep -c '^native-code' /tmp/badging.txt)" = "1"
            if grep -q "RECORD_AUDIO" /tmp/badging.txt; then echo "RECORD_AUDIO present"; exit 1; fi
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml $A > /tmp/manifest.txt
            if grep -qi "debuggable" /tmp/manifest.txt; then echo "debuggable flag present"; exit 1; fi
            unzip -l $A | grep 'lib/' > /tmp/libs.txt
            test "$(grep -c "lib/$abi/" /tmp/libs.txt)" = "8"
            test "$(grep -c 'lib/' /tmp/libs.txt)" = "8"
            rm -rf /tmp/x && mkdir /tmp/x && (cd /tmp/x && unzip -q $A 'lib/*')
            for f in /tmp/x/lib/$abi/*.so; do readelf -h $f | grep -E 'Class|Machine' | tr '\n' ' '; echo; done | tee /tmp/elf.txt
            found=0
            for x in $(unzip -Z1 $A | grep '^res/xml/.*\.xml$'); do
              unzip -p $A $x > /tmp/r.xml
              if "$BT/aapt2" dump xmltree --file $x $A | grep -q canTakeScreenshot; then
                "$BT/aapt2" dump xmltree --file $x $A | grep -E "eventTypes|canTakeScreenshot|canRetrieveWindowContent|flags"
                "$BT/aapt2" dump xmltree --file $x $A | grep -q "accessibilityEventTypes.*0x20" || { echo "event types not narrowed"; exit 1; }
                found=1
              fi
            done
            test "$found" = "1"
            sha256sum $A
          done
      - uses: actions/upload-artifact@v4
        with: { name: secure-apks, path: /tmp/out/ }
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        which: [ baseline-0.8.9, secure-arm64 ]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { ref: test/muse-v7 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/download-artifact@v4
        with: { name: secure-apks, path: dl }
      - name: place the APK under test
        run: |
          set -e
          mkdir -p app/build/outputs/apk/debug
          if [ "${{ matrix.which }}" = "baseline-0.8.9" ]; then
            curl -sL -o app/build/outputs/apk/debug/app-debug.apk https://github.com/${{ github.repository }}/releases/download/v0.8.9/AI-Pro-v0.8.9.apk
            echo "e2c975c181e914d1c0fa15145809467ff5163e11d8f54a1d13288edb74360d6b  app/build/outputs/apk/debug/app-debug.apk" | sha256sum -c -
          else
            cp dl/AI-Pro-v0.8.9-secure-beta1.apk app/build/outputs/apk/debug/app-debug.apk
          fi
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - run: python3 -m pip install --user pillow
      - run: (cd ci && nohup python3 -m http.server 8901 >/tmp/httpd.log 2>&1 &)
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash ci/smoke.sh
        env:
          RG_CASES: "C1 C2 C6 C10 C11 C12"
      - name: show verdicts
        if: always()
        run: cat ci/out/rg-verdicts.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "smoke-${{ matrix.which }}", path: ci/out/ }
  publish:
    needs: [ build, smoke ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: beta/secure-src }
      - uses: actions/download-artifact@v4
        with: { name: secure-apks, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: smoke-baseline-0.8.9, path: base }
      - uses: actions/download-artifact@v4
        with: { name: smoke-secure-arm64, path: sec }
      - name: secure build must not regress against baseline 0.8.9 on the same emulator checks
        run: |
          set -e
          norm() { sed -E 's/^([A-Za-z0-9_]+)=([A-Z_]+).*/\1=\2/' "$1" | grep -E '^RG_' | sort; }
          norm base/rg-verdicts.txt > /tmp/b.txt; norm sec/rg-verdicts.txt > /tmp/s.txt
          echo "--- baseline"; cat /tmp/b.txt; echo "--- secure"; cat /tmp/s.txt
          diff /tmp/b.txt /tmp/s.txt
          if grep -q 'RG_INSTALL=FAIL' /tmp/s.txt; then echo install failed; exit 1; fi
          grep -q 'RG_FATAL_LOG_COUNT=0' /tmp/s.txt
      - name: publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          S1=$(sha256sum dl/AI-Pro-v0.8.9-secure-beta1.apk | cut -d' ' -f1)
          S2=$(sha256sum dl/AI-Pro-v0.8.9-secure-v7a-beta1.apk | cut -d' ' -f1)
          cat > /tmp/notes.md <<MSG
          AI Pro 0.8.9 secure beta 1. Two builds of the same 0.8.9 source (commit 150285ca) with four bounded changes. The v0.8.9 release is untouched.

          Files:
          - AI-Pro-v0.8.9-secure-beta1.apk: 64-bit (arm64-v8a), versionCode 35, sha256 $S1
          - AI-Pro-v0.8.9-secure-v7a-beta1.apk: 32-bit (armeabi-v7a), versionCode 36, sha256 $S2

          Changes:
          - Proper release build (not debuggable). The v0.8.9 APK was a debug build with the debuggable flag set.
          - The accessibility service now subscribes to window-state events only, not every UI event. It still takes screenshots and reads windows on demand.
          - Removed the RECORD_AUDIO permission. The app never records audio.
          - Cached screen crops and GIFs older than 24 hours are deleted.

          Signed with the same release key as v0.8.9 (cert sha256 ab63ad55...aeb1f06). Build checks: cert, ELF class and architecture, permissions, no debuggable flag, narrowed accessibility event types. Emulator smoke checks (x86_64 emulator with ARM translation) were run on the 64-bit build and match the v0.8.9 baseline. The 32-bit build was NOT run on any device or emulator.

          Android may still show "Allow restricted settings" for this app because it uses an accessibility service and is installed outside Google Play. That is an Android protection. See https://support.google.com/android/answer/12623953
          MSG
          gh release create v0.8.9-secure-beta1 dl/AI-Pro-v0.8.9-secure-beta1.apk dl/AI-Pro-v0.8.9-secure-v7a-beta1.apk --repo "$GITHUB_REPOSITORY" --target beta/secure-src --prerelease --title "AI Pro 0.8.9 secure beta 1 (64-bit and 32-bit)" --notes-file /tmp/notes.md
          gh release view v0.8.9-secure-beta1 --repo "$GITHUB_REPOSITORY" --json url,isPrerelease -q '.url, .isPrerelease'
