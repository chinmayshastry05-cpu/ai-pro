plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
// Signing: when a persistent keystore exists one level above the repo (local build
// machine only), sign with it so updates install cleanly over each other. The
// keystore and this properties file are NEVER committed - anyone building the
// repo straight from GitHub simply gets the normal debug-signed APK.
def ksProps = new Properties()
def ksFile = rootProject.file('../keystore.properties')
def hasReleaseKey = ksFile.exists()
if (hasReleaseKey) { ksFile.withInputStream { ksProps.load(it) } }

android {
    namespace 'com.aipro.select'
    compileSdk 33
    signingConfigs {
        release {
            storeFile file(ksProps['storeFile'] ?: 'unused')
            storePassword ksProps['storePassword'] ?: 'unused'
            keyAlias ksProps['keyAlias'] ?: 'unused'
            keyPassword ksProps['keyPassword'] ?: 'unused'
        }
    }
    defaultConfig {
        applicationId "com.aipro.select"
        minSdk 30
        targetSdk 33
        versionCode 29
        versionName "0.8.6"
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug { if (hasReleaseKey) signingConfig signingConfigs.release }
        release { if (hasReleaseKey) signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    kotlinOptions { jvmTarget = '11' }
}
dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.21'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.github.adaptech-cz.Tesseract4Android:tesseract4android:4.8.0'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.5'
    implementation 'com.google.mlkit:entity-extraction:16.0.0-beta5'
}
