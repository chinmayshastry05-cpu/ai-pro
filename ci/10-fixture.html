<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;background:#fff;color:#111;font-family:sans-serif}
.w{position:absolute;font-size:26px;white-space:nowrap}
textarea{position:absolute;left:10px;width:300px;height:80px;font-size:20px}</style></head><body>
<textarea id="t"></textarea>
<script>
var x=new XMLHttpRequest();x.open('GET','11-layout.json',false);x.send();var L=JSON.parse(x.responseText);
L.words.forEach(function(r,i){r.forEach(function(w,j){var d=document.createElement('div');d.className='w';d.style.top=(i*L.row+L.top)+'px';d.style.left=(L.left+j*L.col)+'px';d.textContent=w;document.body.appendChild(d);});});
document.getElementById('t').style.top=L.textarea_top+'px';
</script></body></html>
